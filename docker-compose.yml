services:
  lab-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dbeduca}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dbeduca123}
      POSTGRES_DB: ${POSTGRES_DB:-dbeduca_lab}
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dbeduca} -d ${POSTGRES_DB:-dbeduca_lab}"]
      interval: 10s
      timeout: 5s
      retries: 5

  lab-mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-dbeduca_lab}
      MYSQL_USER: ${MYSQL_USER:-dbeduca}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-dbeduca123}
    ports:
      - "53306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root123}"]
      interval: 10s
      timeout: 5s
      retries: 8

  lab-mongo:
    image: mongo:8.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-dbeduca}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-dbeduca123}
    ports:
      - "57017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username ${MONGO_INITDB_ROOT_USERNAME:-dbeduca} --password ${MONGO_INITDB_ROOT_PASSWORD:-dbeduca123} --authenticationDatabase admin --eval \"db.adminCommand('ping').ok\""]
      interval: 10s
      timeout: 5s
      retries: 8

  lab-oracle:
    image: gvenzl/oracle-free:23-slim
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:-oracle123}
      APP_USER: ${ORACLE_APP_USER:-dbeduca}
      APP_USER_PASSWORD: ${ORACLE_APP_USER_PASSWORD:-dbeduca123}
    ports:
      - "51521:1521"
    volumes:
      - oracle_data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  mysql_data:
  mongo_data:
  oracle_data:
